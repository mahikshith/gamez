# Proves the Eggscape iPhone shell (eggscape/ios, an xtool SwiftPM app) still compiles: builds the game page for iOS,
# then compiles the package for the iOS Simulator with xcodebuild (no signing). Runs by hand, and by itself only when the
# iPhone shell or this file changes (the repository is public, so macOS minutes are free; keep it narrow all the same).
# Installing on a real iPhone is done with xtool on a computer: eggscape/docs/ios-test.md.
name: iOS build check
on:
  workflow_dispatch:
  push:
    paths:
      - 'eggscape/ios/**'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
concurrency:
  group: ios-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the game page for iOS
        working-directory: eggscape
        run: |
          npm ci
          node tools/build.mjs --target ios
          ls -l ios/Resources/game
      - name: Compile for the iOS Simulator (no signing)
        working-directory: eggscape/ios
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild build \
            -scheme Eggscape \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      # the same .app xtool makes for a phone (resources, Info.plist, icon), built for the Simulator
      - name: Package the app with xtool (Simulator, unsigned)
        working-directory: eggscape/ios
        run: |
          brew install xtool-org/tap/xtool
          xtool dev build --triple "$(uname -m)-apple-ios-simulator"
          ls -l xtool/Eggscape.app xtool/Eggscape.app/game
          plutil -p xtool/Eggscape.app/Info.plist
      # the app really running: the dev page in the same shell, on a simulated iPhone, playing by itself
      # (ios/ci/smoke.js: title, level card, a level by the bot, the win page, the map), a screenshot every 5 s
      - name: Run it on a simulated iPhone
        working-directory: eggscape
        run: |
          node tools/build.mjs --target web --dev
          cp dist/dev/index.html ios/Resources/game/index.html
          cd ios
          xtool dev build --triple "$(uname -m)-apple-ios-simulator"
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in sorted(d.items()) if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'SE' not in x['name']]; print(c[-1]['udid'], c[-1]['name'], file=sys.stderr); print(c[-1]['udid'])")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" xtool/Eggscape.app
          mkdir -p shots
          SIMCTL_CHILD_EGG_TEST_SCRIPT="$(cat ci/smoke.js)" xcrun simctl launch "$DEV" com.eggscape.game
          for i in $(seq -w 1 40); do sleep 5; xcrun simctl io "$DEV" screenshot --type=jpeg "shots/shot-$i.jpg" >/dev/null 2>&1 || true; done
          ls -l shots | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-shots
          path: eggscape/ios/shots
          retention-days: 14
