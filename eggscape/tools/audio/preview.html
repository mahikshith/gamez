<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eggscape Sound Preview</title>
<style>
  :root {
    --bg: #f6f3ec; --panel: #ffffff; --ink: #2b2620; --muted: #7a7064; --line: #e3dccf;
    --accent: #d9822b; --accent-ink: #ffffff; --on: #3f8f5a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1a17; --panel: #27231f; --ink: #f1ebe2; --muted: #a59a8c; --line: #3a342d; --accent: #e8954a; --accent-ink: #1d1a17; --on: #6cc18a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  p.sub { margin: 0 0 16px; color: var(--muted); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 6px; }
  button { font: inherit; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; text-align: left; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.active { outline: 2px solid var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  label output { color: var(--ink); min-width: 36px; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 140px; accent-color: var(--accent); }
  select { font: inherit; padding: 5px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  #status { font-variant-numeric: tabular-nums; color: var(--muted); }
  @media (max-width: 520px) { input[type=range] { width: 100px; } }
</style>
</head>
<body>
<main>
  <h1>Eggscape sound preview</h1>
  <p class="sub">All sounds are synthesized live by <code>src/audio.js</code>. Serve with <code>node tools/audio/render.mjs --serve</code>.</p>

  <section>
    <h2>Engine</h2>
    <div class="row">
      <button class="primary" id="unlock">Unlock audio</button>
      <label><input type="checkbox" id="sfxOn" checked> SFX</label>
      <label><input type="checkbox" id="musicOn" checked> Music</label>
      <button id="pause">pauseAll</button>
      <button id="resume">resumeAll</button>
      <button id="duck">duck(0.6, 1.5)</button>
      <button id="stress">Stress: 40 sounds</button>
      <span id="status"></span>
    </div>
  </section>

  <section>
    <h2>Sound options</h2>
    <div class="row">
      <label>vol <input type="range" id="vol" min="0" max="1.5" step="0.05" value="1"><output></output></label>
      <label>pitch <input type="range" id="pitch" min="0.5" max="2" step="0.01" value="1"><output></output></label>
      <label>pan <input type="range" id="pan" min="-1" max="1" step="0.05" value="0"><output></output></label>
      <label>intensity <input type="range" id="intensity" min="0" max="1" step="0.05" value="0.6"><output></output></label>
      <label>material <select id="material"></select></label>
      <label><input type="checkbox" id="randomize"> random pan/intensity</label>
    </div>
  </section>

  <section>
    <h2>Sound effects</h2>
    <div class="grid" id="sfx"></div>
    <div class="row" style="margin-top:10px"><button id="fuseStop">Stop last bomb_fuse</button></div>
  </section>

  <section>
    <h2>Loops and ambience</h2>
    <div class="row">
      <label>ring turn <input type="range" id="ring" min="0" max="1" step="0.01" value="0"><output></output></label>
      <label><input type="checkbox" id="wobble"> auto wobble (simulated drag)</label>
      <label>wind <input type="range" id="wind" min="0" max="1" step="0.01" value="0"><output></output></label>
      <label><input type="checkbox" id="fire"> fire loop</label>
      <label><input type="checkbox" id="underwater"> underwater</label>
    </div>
  </section>

  <section>
    <h2>Music</h2>
    <div class="grid" id="moods"></div>
    <div class="row" style="margin-top:10px">
      <label>root <select id="root"></select></label>
      <label>scale <select id="scale"></select></label>
      <label>bpm <input type="range" id="bpm" min="60" max="160" step="1" value="100"><output></output></label>
      <label>mood <select id="mood"></select></label>
      <button id="playCustom">Play custom</button>
      <button id="stopMusic">stopMusic</button>
    </div>
  </section>
</main>

<script type="module">
import { audio, SFX_NAMES, MATERIALS, MOODS } from '../../src/audio.js';
import { DEMO_SPECS } from './demo-specs.js';

const $ = (id) => document.getElementById(id);
const val = (id) => parseFloat($(id).value);
for (const el of document.querySelectorAll('input[type=range]')) {
  const out = el.parentElement.querySelector('output');
  const upd = () => { if (out) out.textContent = el.value; };
  el.addEventListener('input', upd); upd();
}
const fill = (sel, items) => { for (const it of items) { const o = document.createElement('option'); o.value = o.textContent = it; sel.appendChild(o); } };
fill($('material'), MATERIALS);
fill($('root'), ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B']);
fill($('scale'), ['major', 'minor', 'dorian', 'pentatonic', 'phrygian', 'lydian']);
fill($('mood'), MOODS);

// every interaction unlocks first (first user gesture)
document.addEventListener('pointerdown', () => audio.unlock(), { capture: true });
document.addEventListener('keydown', () => audio.unlock(), { capture: true });
$('unlock').onclick = () => audio.unlock();

let lastFuse = null;
const opts = () => {
  const r = $('randomize').checked;
  return { vol: val('vol'), pitch: val('pitch'), pan: r ? Math.random() * 2 - 1 : val('pan'), intensity: r ? Math.random() : val('intensity') };
};
for (const name of SFX_NAMES) {
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => { audio.unlock(); const h = audio.play(name, opts()); if (name === 'bomb_fuse') lastFuse = h; };
  $('sfx').appendChild(b);
}
$('fuseStop').onclick = () => lastFuse && lastFuse.stop();
$('material').onchange = () => audio.setMaterial($('material').value);
$('sfxOn').onchange = () => audio.setSfx($('sfxOn').checked);
$('musicOn').onchange = () => audio.setMusic($('musicOn').checked);
$('pause').onclick = () => audio.pauseAll();
$('resume').onclick = () => audio.resumeAll();
$('duck').onclick = () => audio.duck(0.6, 1.5);
$('stress').onclick = () => { for (let i = 0; i < 40; i++) audio.play(SFX_NAMES[(i * 7) % SFX_NAMES.length], { intensity: 1, pan: Math.random() * 2 - 1 }); };
$('wind').oninput = () => audio.setWind(val('wind'));
$('fire').onchange = () => audio.setFireLoop($('fire').checked);
$('underwater').onchange = () => audio.setUnderwater($('underwater').checked);

// the game calls setRingTurn every frame; emulate that
let t0 = performance.now();
function frame(t) {
  let s = val('ring');
  if ($('wobble').checked) s = Math.max(0, Math.sin((t - t0) / 700)) * Math.max(s, 0.8) * (0.8 + 0.2 * Math.sin(t / 97));
  audio.setRingTurn(s);
  const st = audio.stats();
  $('status').textContent = audio.ready ? `ctx ${audio.ctx.state} | voices ${st.voices} | music ${st.mood || '-'} | loops ${st.loops.join(',') || '-'}` : 'locked';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

let activeMood = null;
for (const d of DEMO_SPECS) {
  const b = document.createElement('button');
  b.innerHTML = `${d.label}<br><small style="color:var(--muted)">${d.spec.root} ${d.spec.scale} ${d.spec.bpm}</small>`;
  b.onclick = () => {
    audio.unlock(); audio.music(d.spec);
    if (activeMood) activeMood.classList.remove('active'); b.classList.add('active'); activeMood = b;
    $('root').value = d.spec.root; $('scale').value = d.spec.scale; $('bpm').value = d.spec.bpm; $('bpm').dispatchEvent(new Event('input'));
  };
  $('moods').appendChild(b);
}
$('playCustom').onclick = () => audio.music({ root: $('root').value, scale: $('scale').value, bpm: val('bpm'), mood: $('mood').value });
$('stopMusic').onclick = () => { audio.stopMusic(); if (activeMood) activeMood.classList.remove('active'); activeMood = null; };
</script>
</body>
</html>
