<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backdrop Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; }
  #bar { position: fixed; left: 8px; bottom: 8px; font: 12px/1.3 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 6px; }
  #bar select { font: inherit; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script type="module">
import { THEMES, createBackdrop } from '../src/themes.js';
// URL params: theme, w, h, dpr, t (freeze time), grey=1 (grey rings), ui=0 (hide bar), anim=0, cx, cy, zoom
const q = new URLSearchParams(location.search);
const id = q.get('theme') || 'farm';
const theme = THEMES.find((x) => x.id === id) || THEMES[0];
const W = +q.get('w') || innerWidth, H = +q.get('h') || innerHeight;
const dpr = +q.get('dpr') || devicePixelRatio || 1;
const cv = document.getElementById('cv'); const ctx = cv.getContext('2d');
cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px';
const bd = createBackdrop(theme, +q.get('seed') || 1);
bd.resize(W, H, dpr);
const cam = { x: +q.get('cx') || 0, y: +q.get('cy') || 0, zoom: +q.get('zoom') || 1 };
const grey = q.get('grey') === '1';
const groundH = Math.round(H * 0.12), groundY = H - groundH;

function egg(x, y, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  const s = Math.min(W, H) * 0.035;
  ctx.beginPath(); ctx.moveTo(0, -s * 1.3);
  ctx.bezierCurveTo(s * 0.95, -s * 1.3, s * 1.05, s * 0.4, s * 0.95 * 0.98, s * 0.55);
  ctx.bezierCurveTo(s * 0.8, s * 1.05, -s * 0.8, s * 1.05, -s * 0.97, s * 0.55);
  ctx.bezierCurveTo(-s * 1.05, s * 0.4, -s * 0.95, -s * 1.3, 0, -s * 1.3);
  ctx.fillStyle = '#f7efdc'; ctx.fill();
  ctx.lineWidth = Math.max(1, s * 0.09); ctx.strokeStyle = '#6b5a45'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-s * 0.35, -s * 0.5, s * 0.18, s * 0.35, 0.3, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill();
  ctx.restore();
}
function vault(t) {
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.45;
  const ring = grey ? { base: '#9a9a9a', light: '#c8c8c8', dark: '#5e5e5e' } : theme.palette.ring;
  const rings = [0.28, 0.5, 0.72, 0.94];
  rings.forEach((k, i) => {
    const r = R * k, th = R * 0.065, gap = 0.55, a0 = t * 0.2 * (i % 2 ? -1 : 1) + i * 1.7;
    ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.arc(cx, cy, r, a0 + gap / 2, a0 + Math.PI * 2 - gap / 2);
    ctx.strokeStyle = ring.dark; ctx.lineWidth = th; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r - th * 0.12, a0 + gap / 2, a0 + Math.PI * 2 - gap / 2);
    ctx.strokeStyle = ring.base; ctx.lineWidth = th * 0.7; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r - th * 0.3, a0 + gap / 2, a0 + Math.PI * 2 - gap / 2);
    ctx.strokeStyle = ring.light; ctx.lineWidth = th * 0.15; ctx.stroke();
    // thorns on ring 2
    if (i === 2) for (let k2 = 0; k2 < 6; k2++) { const a = a0 + 1 + k2 * 0.25, x = cx + Math.cos(a) * (r - th / 2), y = cy + Math.sin(a) * (r - th / 2); ctx.beginPath(); ctx.moveTo(x + Math.cos(a + 1.57) * th * 0.3, y + Math.sin(a + 1.57) * th * 0.3); ctx.lineTo(x - Math.cos(a) * th * 0.8, y - Math.sin(a) * th * 0.8); ctx.lineTo(x - Math.cos(a + 1.57) * th * 0.3, y - Math.sin(a + 1.57) * th * 0.3); ctx.fillStyle = theme.palette.thorn; ctx.fill(); }
  });
  egg(cx + R * 0.05, cy + R * 0.17, 0.3);
  egg(cx - R * 0.42, cy + R * 0.42, -0.5);
  egg(cx + R * 0.6, cy - R * 0.3, 1.1);
}
function nest() {
  const x = W / 2, y = groundY, s = Math.min(W, H) * 0.11;
  ctx.beginPath(); ctx.ellipse(x, y - s * 0.12, s, s * 0.32, 0, 0, Math.PI); ctx.fillStyle = theme.palette.nestStraw; ctx.fill();
  ctx.strokeStyle = 'rgba(80,50,20,0.5)'; ctx.lineWidth = 1.5;
  for (let i = -4; i <= 4; i++) { ctx.beginPath(); ctx.moveTo(x + i * s * 0.2 - s * 0.15, y - s * 0.1); ctx.lineTo(x + i * s * 0.2 + s * 0.15, y + s * 0.08); ctx.stroke(); }
}
function hud() {
  const p = theme.palette; ctx.font = '600 16px system-ui, sans-serif';
  const txt = `Level ${THEMES.indexOf(theme) + 1}  ${theme.name}`; const tw = ctx.measureText(txt).width;
  ctx.fillStyle = p.plate; ctx.beginPath(); ctx.roundRect(10, 10, tw + 24, 30, 10); ctx.fill();
  ctx.fillStyle = p.text; ctx.fillText(txt, 22, 31);
  ctx.fillStyle = p.accent; ctx.beginPath(); ctx.arc(W - 26, 25, 9, 0, Math.PI * 2); ctx.fill();
}
let drawMs = [];
function frame(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const t0 = performance.now();
  bd.draw(ctx, t, cam);
  drawMs.push(performance.now() - t0);
  bd.drawGround(ctx, 0, groundY, W, groundH, t);
  nest();
  vault(t);
  const t1 = performance.now(); bd.drawAmbient(ctx, t, cam); drawMs.push(-(performance.now() - t1));
  if (q.get('hud') !== '0') hud();
}
const tFix = q.get('t');
if (tFix !== null) { frame(+tFix); window.__ready = true; }
else { const start = performance.now(); const loop = () => { frame((performance.now() - start) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); window.__ready = true; }

// benchmark: per-frame cost of each call with a forced raster sync (1px readback) after it,
// minus the cost of the sync alone. Returns average ms per frame.
window.bench = (n = 200) => {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sync = () => ctx.getImageData(0, 0, 1, 1);
  const time = (fn) => { for (let i = 0; i < 10; i++) { fn(i / 60); sync(); } const a = performance.now(); for (let i = 0; i < n; i++) { fn(i / 60); sync(); } return (performance.now() - a) / n; };
  const base = time(() => {});
  const r = {
    draw: time((t) => bd.draw(ctx, t, cam)) - base,
    ground: time((t) => bd.drawGround(ctx, 0, groundY, W, groundH, t)) - base,
    ambient: time((t) => bd.drawAmbient(ctx, t, cam)) - base,
  };
  r.total = r.draw + r.ground + r.ambient;
  for (const k in r) r[k] = +r[k].toFixed(3);
  return r;
};
window.resizeMs = () => { const a = performance.now(); bd.resize(W, H, dpr); return +(performance.now() - a).toFixed(1); };

if (q.get('ui') !== '0') {
  const bar = document.getElementById('bar');
  bar.innerHTML = `<select id="sel">${THEMES.map((x, i) => `<option value="${x.id}" ${x.id === theme.id ? 'selected' : ''}>${i + 1}. ${x.name}</option>`).join('')}</select> <label><input type="checkbox" id="g" ${grey ? 'checked' : ''}> grey rings</label>`;
  const go = () => { q.set('theme', document.getElementById('sel').value); q.set('grey', document.getElementById('g').checked ? '1' : '0'); location.search = q.toString(); };
  document.getElementById('sel').onchange = go; document.getElementById('g').onchange = go;
} else document.getElementById('bar').remove();
</script>
</body>
</html>
