<head>

<title>Eggscape</title>
<script>window.__t0 = performance.now();</script>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1410; }
  body {
    position: fixed; inset: 0;
    touch-action: none; -ms-touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas#game { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* launch sting (2026-11-16, mykee: "a proper animation, never a loading page"): pure CSS + SVG so it plays the moment the
     app opens, before the game script has even parsed. Three vault rings spin in and click their gaps into line, the egg
     drops through into the nest, the logo bounces in letter by letter; then it cross-fades into the home screen. */
  @font-face { font-family: 'FredokaS'; font-weight: 600; src: url(<!--SPLASH_FONT-->) format('woff2'); font-display: block; }
  #splash { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; overflow: hidden;
    background: radial-gradient(130% 70% at 50% 42%, #9fd6f5 0%, #5aa6dc 46%, #2b5f9e 100%); transition: opacity .5s ease; z-index: 5; }
  #splash.out { opacity: 0; }
  #splash::after { content: ''; position: absolute; left: -10%; right: -10%; bottom: -6vh; height: 24vh; border-radius: 50% 50% 0 0 / 40% 40% 0 0; background: linear-gradient(#7cc34e, #4c8f2f); }
  #splash .rays { position: absolute; left: 50%; top: 46%; width: 180vmax; height: 180vmax; margin: -90vmax 0 0 -90vmax; background: repeating-conic-gradient(rgba(255,255,255,.10) 0 9deg, rgba(255,255,255,0) 9deg 22.5deg); animation: rays 14s linear infinite; }
  #splash .word { position: absolute; top: max(6vh, env(safe-area-inset-top)); z-index: 2; font: 600 min(15vw, 9vh)/1 FredokaS, "Arial Rounded MT Bold", system-ui, sans-serif; letter-spacing: .02em; white-space: nowrap; }
  #splash .word span { display: inline-block; color: #fff3c4; -webkit-text-stroke: .16em #7a3410; paint-order: stroke fill; text-shadow: 0 .09em 0 #5a240a, 0 .16em .12em rgba(40,10,0,.35);
    background: linear-gradient(#fff8d8, #ffc93a); -webkit-background-clip: text; background-clip: text; opacity: 0; animation: drop .55s cubic-bezier(.2,1.5,.45,1) both; }
  #splash .vault { position: relative; z-index: 2; width: min(84vw, 48vh); height: min(103vw, 59vh); margin-top: 6vh; }
  #splash .ring { transform-box: view-box; transform-origin: 0 0; }
  #splash .r1 { animation: spin1 1.15s cubic-bezier(.25,1.25,.4,1) .05s both; }
  #splash .r2 { animation: spin2 1.15s cubic-bezier(.25,1.25,.4,1) .12s both; }
  #splash .r3 { animation: spin3 1.15s cubic-bezier(.25,1.25,.4,1) .19s both; }
  #splash .egg { transform-box: view-box; transform-origin: 0 0; animation: fall .55s cubic-bezier(.55,0,.75,.4) 1.25s both; }
  #splash .eggin { transform-box: fill-box; transform-origin: 50% 100%; animation: squash .45s ease-out 1.8s both, wiggle 1.6s ease-in-out 2.3s infinite; }
  #splash .spark { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: spark .7s ease-out 1.85s both; }
  #splash .glint { opacity: 0; animation: glint .5s ease-out 1.05s both; }
  @keyframes rays { to { transform: rotate(360deg); } }
  @keyframes drop { 0% { opacity: 0; transform: translateY(-60%) scale(.6); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes spin1 { from { transform: rotate(-200deg) scale(.6); opacity: 0; } 25% { opacity: 1; } to { transform: rotate(0) scale(1); opacity: 1; } }
  @keyframes spin2 { from { transform: rotate(250deg) scale(.6); opacity: 0; } 25% { opacity: 1; } to { transform: rotate(0) scale(1); opacity: 1; } }
  @keyframes spin3 { from { transform: rotate(-300deg) scale(.6); opacity: 0; } 25% { opacity: 1; } to { transform: rotate(0) scale(1); opacity: 1; } }
  @keyframes fall { from { transform: translateY(0); } to { transform: translateY(196px); } }
  @keyframes squash { 0% { transform: scale(1.18,.8); } 35% { transform: scale(.92,1.1); } 70% { transform: scale(1.04,.97); } 100% { transform: none; } }
  @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-7deg); } 86% { transform: rotate(6deg); } 93% { transform: rotate(-3deg); } }
  @keyframes spark { 0% { opacity: 0; transform: scale(.2); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4) translateY(-14px); } }
  @keyframes glint { 0% { opacity: 0; } 30% { opacity: .9; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #splash *, #splash .word span { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }
</style>
