<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Eggscape</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1410; }
  body {
    position: fixed; inset: 0;
    touch-action: none; -ms-touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas#game { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* launch animation (2026-11-15: no "Loading..." page): drawn by the browser before any script runs, then cross-faded away */
  #splash { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none;
    background: radial-gradient(120% 80% at 50% 38%, #ffcf7a 0%, #f39a3c 38%, #b8541f 72%, #5a2410 100%); transition: opacity .45s ease; z-index: 5; }
  #splash.out { opacity: 0; }
  #splash .stage { position: relative; width: 150px; height: 170px; }
  #splash .egg { position: absolute; left: 39px; bottom: 34px; width: 72px; height: 92px; transform-origin: 50% 100%; animation: hop 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
  #splash .shadow { position: absolute; left: 45px; bottom: 26px; width: 60px; height: 12px; border-radius: 50%; background: rgba(60,20,4,.35); animation: shade 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
  #splash .nest { position: absolute; left: 13px; bottom: 6px; width: 124px; height: 40px; }
  #splash .word { margin-top: 18px; font: 800 40px/1 "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; letter-spacing: .06em; color: #fff4d6;
    -webkit-text-stroke: 6px #6b2c0c; paint-order: stroke fill; text-shadow: 0 5px 0 #6b2c0c; animation: pop .7s cubic-bezier(.2,1.6,.4,1) both; }
  #splash .dots { margin-top: 16px; display: flex; gap: 9px; }
  #splash .dots i { width: 11px; height: 14px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #fff4d6; box-shadow: 0 2px 0 #6b2c0c; animation: dot 1.1s ease-in-out infinite; }
  #splash .dots i:nth-child(2) { animation-delay: .18s; } #splash .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1.08,.9); } 18% { transform: translateY(0) scale(.94,1.07); } 50% { transform: translateY(-46px) rotate(-6deg) scale(1,1); } 82% { transform: translateY(0) scale(1.06,.93); } }
  @keyframes shade { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .5; } }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes dot { 0%,100% { transform: translateY(0); opacity: .55; } 40% { transform: translateY(-7px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #splash .egg, #splash .shadow, #splash .dots i { animation: none; } }
</style>
<!--PORTAL_HEAD-->
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="splash" aria-label="Eggscape">
  <div class="stage">
    <div class="shadow"></div>
    <svg class="egg" viewBox="0 0 72 92"><defs><radialGradient id="eg" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".65" stop-color="#f6e6c4"/><stop offset="1" stop-color="#e2c595"/></radialGradient></defs>
      <path d="M36 3C18 3 4 33 4 55c0 19 14 34 32 34s32-15 32-34C68 33 54 3 36 3z" fill="url(#eg)" stroke="#6b4a2a" stroke-width="4"/>
      <ellipse cx="25" cy="27" rx="6" ry="4" fill="#fff" opacity=".8" transform="rotate(-30 25 27)"/>
      <path d="M24 52q3-4 6 0M42 52q3-4 6 0" fill="none" stroke="#3a2412" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M30 62q6 6 12 0" fill="none" stroke="#3a2412" stroke-width="3.2" stroke-linecap="round"/>
      <ellipse cx="20" cy="60" rx="5" ry="3" fill="#ff9a8a" opacity=".55"/><ellipse cx="52" cy="60" rx="5" ry="3" fill="#ff9a8a" opacity=".55"/></svg>
    <svg class="nest" viewBox="0 0 124 40"><path d="M4 8c10 26 34 30 58 30s48-4 58-30" fill="#a8692c" stroke="#5a3210" stroke-width="4" stroke-linejoin="round"/>
      <path d="M12 16c16 8 34 11 50 11s34-3 50-11M18 25c14 6 28 8 44 8s30-2 44-8" fill="none" stroke="#e0a45a" stroke-width="3" stroke-linecap="round"/></svg>
  </div>
  <div class="word">EGGSCAPE</div>
  <div class="dots"><i></i><i></i><i></i></div>
</div>
<!--GAME_SCRIPT-->
</body>
</html>
