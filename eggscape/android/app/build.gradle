plugins { id 'com.android.application' }

android {
    namespace 'com.eggscape.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.eggscape.game'
        minSdk 24
        targetSdk 34
        versionCode 25
        versionName '0.8.17'
        ndk { abiFilters 'arm64-v8a' }
        // -Punlocked: the separate everything-unlocked test app; it installs beside the normal one under its own id and name
        if (project.hasProperty('unlocked')) { applicationIdSuffix '.unlocked'; versionNameSuffix '-unlocked' }
        resValue 'string', 'app_label', project.hasProperty('unlocked') ? 'Eggscape UNLOCKED' : 'Eggscape'
    }
    // throwaway proof key kept in the repo so every proof build installs over the last one; NOT for store releases
    signingConfigs { proof { storeFile rootProject.file('proof.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { debug { debuggable true; signingConfig signingConfigs.proof } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-ads:23.6.0' // AdMob (test ids until the real ones are set)
    implementation 'com.android.billingclient:billing:7.1.1' // in-app products (coins, bundles, Premium)
}
