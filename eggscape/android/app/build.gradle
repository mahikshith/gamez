plugins { id 'com.android.application' }

android {
    namespace 'com.eggscape.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.eggscape.game'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    // throwaway proof key kept in the repo so every proof build installs over the last one; NOT for store releases
    signingConfigs { proof { storeFile rootProject.file('proof.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { debug { debuggable true; signingConfig signingConfigs.proof } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
